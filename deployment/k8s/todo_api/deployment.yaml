apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: todo-app
  name: todo-api-service
  labels:
    app: todo-api-service
    environment: development
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-api-service
  template:
    metadata:
      labels:
        app: todo-api-service
    spec:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      imagePullSecrets: 
      - name: ghcr-secret
      terminationGracePeriodSeconds: 40
      containers:
      - name: todo-api-container
        image: ghcr.io/100bench/todo-api:v1
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: todo-api-config
        - secretRef:
            name: todo-api-secret
        env:
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

