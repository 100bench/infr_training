services:
 
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -h localhost -d todo_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./todo_api/deployment/migrations:/migrations:ro
    command: 
      ["-path", "/migrations", "-database", "${DSN_STRING}", "up"]

  notify-api:
    dns: 
      - 8.8.8.8
    build:
      context: .
      dockerfile: notify_api/Dockerfile
    ports:
      - "50051:50051"

  todo-api:
    dns: 
      - 8.8.8.8
    build:
      context: .
      dockerfile: todo_api/Dockerfile
    ports: 
      - "8080:8080"
    environment:
      NOTIFY_SERVICE_ADDR: ${NOTIFY_SERVICE_ADDR}
      REDIS_ADDR: ${REDIS_ADDR}
      DSN_STRING: ${DSN_STRING}
    depends_on:
      db:
          condition: service_healthy
      redis:
          condition: service_healthy
      notify-api:
          condition: service_started

volumes:
  pgdata:
  redis_data: