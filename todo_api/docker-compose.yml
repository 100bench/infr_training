services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_store
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -h localhost -d todo_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    dns: 
      - 8.8.8.8
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: ${REDIS_ADDR}
      DSN_STRING: ${DSN_STRING}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy


  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deployment/migrations:/migrations:ro
    command: 
      ["-path", "/migrations", "-database", "${DSN_STRING}", "up"]


volumes:
  pgdata:
  redis_data: